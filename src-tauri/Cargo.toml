[package]
name = "qbotwire"
version = "0.1.0"
description = "A desktop workbench for the Tencent QQ Bot API v2"
authors = ["Moonlark"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qbotwire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
thiserror = "2"
tauri-plugin-opener = "2"

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0
